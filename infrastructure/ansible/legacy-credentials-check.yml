---
- name: Verificar cuentas heredadas antes de exponer el frontend
  hosts: database
  become: true
  become_user: postgres
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Contar estudiantes sin hash de contraseña
      community.postgresql.postgresql_query:
        login_unix_socket: /var/run/postgresql
        db: control_asistencia
        query: "SELECT count(*) AS total FROM estudiantes WHERE password_hash IS NULL OR password_hash = ''"
      register: legacy_student_passwords
      changed_when: false
      no_log: true

    - name: Impedir la exposición con estudiantes sin hash
      ansible.builtin.assert:
        that:
          - legacy_student_passwords.query_result[0].total | int == 0
        fail_msg: Hay estudiantes sin hash; deben migrarse antes de exponer el frontend.
