---
- name: Validar entradas de despliegue
  ansible.builtin.assert:
    that:
      - tenant_slug is defined
      - tenant_slug is string
      - tenant_slug is match('^[a-z][a-z0-9-]{2,39}\Z')
      - institution_name is defined
      - institution_name is string
      - institution_name | trim | length > 0
      - institution_name | length <= 200
      - institution_name is not search('[\x00-\x1f\x7f]')
      - tenant_plan_name is defined
      - tenant_plan_name is string
      - tenant_plan_name | trim | length > 0
      - tenant_plan_name | length <= 100
      - tenant_plan_name is not search('[\x00-\x1f\x7f]')
      - backend_revision is defined
      - backend_revision is match('^[a-f0-9]{40}\Z')
      - backend_source_archive is defined
      - backend_wheels_archive is defined
      - backend_private_ip is defined
      - backend_private_ip is string
      - backend_private_ip is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
      - backend_private_ip.split('.') | map('int') | max <= 255
      - database_private_ip is defined
      - database_private_ip is string
      - database_private_ip is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
      - database_private_ip.split('.') | map('int') | max <= 255
      - backend_port is defined
      - backend_port | string is match('^[0-9]{1,5}\Z')
      - backend_port | int >= 1
      - backend_port | int <= 65535
      - frontend_server_name is defined
      - frontend_server_name is string
      - frontend_server_name | length <= 253
      - >-
        frontend_server_name is match('^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}\Z')
        or (frontend_server_name is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
            and frontend_server_name.split('.') | map('int') | max <= 255)
      - vault_postgres_password is defined
      - vault_postgres_password | length >= 20
      - vault_postgres_password is match('^[a-zA-Z0-9_-]+\Z')
      - vault_django_secret_key is defined
      - vault_django_secret_key | length >= 32
      - vault_django_secret_key is match('^[a-zA-Z0-9_-]+\Z')
      - vault_student_initial_passwords_key is defined
      - vault_student_initial_passwords_key is string
      - vault_student_initial_passwords_key is match('^[a-zA-Z0-9_-]{43}=\Z')
      - vault_admin_password is defined
      - vault_admin_password | length >= 12
      - "'\n' not in vault_admin_password"
      - "'\r' not in vault_admin_password"
      - admin_name is defined
      - admin_name | length > 0
      - admin_email is defined
      - admin_email is match('^[^\s@]+@[^\s@]+\.[^\s@]+\Z')
    fail_msg: Faltan entradas válidas, artefactos o secretos para configurar el backend.
  no_log: true

- name: Crear usuario de servicio
  ansible.builtin.user:
    name: campus-cloud
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Crear directorios de aplicación
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/opt/campus-cloud/{{ tenant_slug }}/backend"
    - "/opt/campus-cloud/{{ tenant_slug }}/backend/releases"
    - "/opt/campus-cloud/{{ tenant_slug }}/backend/releases/{{ backend_revision }}"
    - "/opt/campus-cloud/{{ tenant_slug }}/backend/wheels"
    - "/etc/campus-cloud/{{ tenant_slug }}"

- name: Copiar y extraer código versionado
  ansible.builtin.unarchive:
    src: "{{ backend_source_archive }}"
    dest: "/opt/campus-cloud/{{ tenant_slug }}/backend/releases/{{ backend_revision }}"
    owner: root
    group: root
  notify: Reiniciar backend de asistencia

- name: Copiar dependencias preparadas sin NAT
  ansible.builtin.unarchive:
    src: "{{ backend_wheels_archive }}"
    dest: "/opt/campus-cloud/{{ tenant_slug }}/backend/wheels"
    owner: root
    group: root
  register: backend_wheels

- name: Crear entorno virtual
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/venv"
    creates: "/opt/campus-cloud/{{ tenant_slug }}/backend/venv/bin/python"

- name: Instalar dependencias fijadas desde paquetes locales
  ansible.builtin.command:
    argv:
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/venv/bin/python"
      - -m
      - pip
      - install
      - --no-index
      - --find-links
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/wheels"
      - -r
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/wheels/requirements.lock"
  register: backend_pip
  changed_when: "'Successfully installed' in backend_pip.stdout"
  notify: Reiniciar backend de asistencia

- name: Activar revisión del backend
  ansible.builtin.file:
    src: "/opt/campus-cloud/{{ tenant_slug }}/backend/releases/{{ backend_revision }}"
    dest: "/opt/campus-cloud/{{ tenant_slug }}/backend/current"
    state: link
  notify: Reiniciar backend de asistencia

- name: Configurar variables públicas de Django
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/backend.env.j2"
    dest: "/etc/campus-cloud/{{ tenant_slug }}/backend.env"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar backend de asistencia

- name: Configurar secretos de Django
  ansible.builtin.template:
    src: backend-secrets.env.j2
    dest: "/etc/campus-cloud/{{ tenant_slug }}/backend-secrets.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Reiniciar backend de asistencia

- name: Aplicar migraciones de Django
  ansible.builtin.command:
    argv:
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/venv/bin/python"
      - manage.py
      - migrate
      - --noinput
    chdir: "/opt/campus-cloud/{{ tenant_slug }}/backend/current"
  environment: &backend_environment
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: "{{ vault_django_secret_key }}"
    STUDENT_INITIAL_PASSWORDS_KEY: "{{ vault_student_initial_passwords_key }}"
    DJANGO_ALLOWED_HOSTS: "{{ frontend_server_name }}"
    POSTGRES_DB: control_asistencia
    POSTGRES_USER: asistencia
    POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
    POSTGRES_HOST: "{{ database_private_ip }}"
    POSTGRES_PORT: "5432"
    TIME_ZONE: America/La_Paz
  register: backend_migration
  changed_when: "'No migrations to apply.' not in backend_migration.stdout"
  no_log: true

- name: Crear administrador inicial sin exponer la contraseña
  vars:
    ansible_ssh_use_tty: false
  ansible.builtin.command:
    argv:
      - "/opt/campus-cloud/{{ tenant_slug }}/backend/venv/bin/python"
      - manage.py
      - seed_admin
      - --nombre
      - "{{ admin_name }}"
      - --correo
      - "{{ admin_email }}"
    chdir: "/opt/campus-cloud/{{ tenant_slug }}/backend/current"
    stdin: "{{ vault_admin_password }}\n{{ vault_admin_password }}"
  environment: *backend_environment
  register: backend_admin
  changed_when: "'no se realizaron cambios' not in backend_admin.stdout"
  no_log: true

- name: Instalar unidad systemd
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/backend.service.j2"
    dest: "/etc/systemd/system/campus-cloud-{{ tenant_slug }}.service"
    owner: root
    group: root
    mode: "0644"
  register: backend_unit
  notify: Reiniciar backend de asistencia

- name: Recargar systemd cuando cambie la unidad
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: backend_unit.changed

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Habilitar y arrancar backend
  ansible.builtin.systemd_service:
    name: "campus-cloud-{{ tenant_slug }}.service"
    enabled: true
    state: started

- name: Verificar servicio de backend en interfaz privada
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/api/health"
    headers:
      Host: "{{ frontend_server_name }}"
      X-Forwarded-Proto: https
    status_code: 200
  register: backend_health
  retries: 10
  delay: 3
  until: backend_health.status == 200

- name: Verificar identidad pública del tenant configurado
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/api/tenant"
    headers:
      Host: "{{ frontend_server_name }}"
      X-Forwarded-Proto: https
    status_code: 200
  register: backend_tenant
  retries: 10
  delay: 3
  until: >-
    backend_tenant.status == 200 and
    (backend_tenant.json | default({})).get('tenant') ==
    {'slug': tenant_slug, 'name': (institution_name | trim), 'plan': (tenant_plan_name | trim)}
