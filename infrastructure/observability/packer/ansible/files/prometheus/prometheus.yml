global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    proyecto: "proyecto-modulo-2"
    rol:      "observabilidad"

# Archivos de reglas de alerta
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager (configurar cuando se integre)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["localhost:9093"]

scrape_configs:
  # Métricas del propio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          scope: "control-center"
          rol:   "observabilidad"

  # Node exporter del servidor de observabilidad
  - job_name: "node-exporter-obs"
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          scope: "control-center"
          rol:   "observabilidad"

  # Node exporter de los servidores de cada tenant.
  # El integrante 5 actualiza este archivo (o usa file_sd) al crear/suspender tenants.
  # Formato de etiquetas obligatorio: tenant, environment, role, scope=tenant
  - job_name: "node-exporter-tenants"
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/tenants/*.yml"
        refresh_interval: 30s

  # Postgres exporter (habilitado por integrante 4 en cada servidor database)
  - job_name: "postgres-exporter-tenants"
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/postgres/*.yml"
        refresh_interval: 30s
