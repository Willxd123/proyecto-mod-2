---
# Genera una propuesta local; no instala ni modifica servidores.
- name: Preparar configuración de frontend para un tenant
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    stage_root: "{{ playbook_dir }}/../../output/ansible-stage"
  tasks:
    - name: Validar las entradas requeridas
      ansible.builtin.assert:
        that:
          - tenant_slug is defined
          - tenant_slug is string
          - tenant_slug is match('^[a-z][a-z0-9-]{2,39}\Z')
          - frontend_server_name is defined
          - frontend_server_name is string
          - frontend_server_name | length <= 253
          - >-
            frontend_server_name is match('^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}\Z')
            or (frontend_server_name is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
                and frontend_server_name.split('.') | map('int') | max <= 255)
          - backend_private_ip is defined
          - backend_private_ip is string
          - backend_private_ip is match('^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}\Z')
          - backend_private_ip.split('.') | map('int') | max <= 255
          - backend_port is defined
          - backend_port | string is match('^[0-9]{1,5}\Z')
          - backend_port | int >= 1
          - backend_port | int <= 65535
        fail_msg: Se requieren tenant_slug válido, dominio DNS, IPv4 de backend y puerto entre 1 y 65535.

    - name: Crear directorio local de preparación
      ansible.builtin.file:
        path: "{{ stage_root }}/{{ tenant_slug }}"
        state: directory
        mode: "0700"

    - name: Generar configuración Nginx sin instalarla
      ansible.builtin.template:
        src: templates/frontend-nginx.conf.j2
        dest: "{{ stage_root }}/{{ tenant_slug }}/nginx.conf"
        mode: "0600"
