---
# Configura únicamente los componentes implementados; aún no despliega el frontend.
- import_playbook: preflight.yml

- name: Configurar PostgreSQL del tenant
  hosts: database
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - database

- name: Configurar backend de asistencia
  hosts: backend
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - backend

- name: Configurar métricas privadas de PostgreSQL
  hosts: database
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - postgres_exporter
