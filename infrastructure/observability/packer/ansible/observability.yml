---
- name: Imagen de observabilidad — Prometheus + Grafana (nativa, sin contenedores)
  hosts: all
  become: true
  connection: local

  vars:
    prometheus_version: "2.54.1"
    grafana_version: "11.2.0"
  tasks:

    # ---- Prometheus (binario) -----------------------------------------------
    - name: Usuario de sistema para Prometheus
      ansible.builtin.user:
        name: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Descargar Prometheus
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz
        mode: "0644"

    - name: Extraer Prometheus
      ansible.builtin.unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp
        remote_src: true
        creates: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64"

    - name: Instalar binarios de Prometheus
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - prometheus
        - promtool

    - name: Directorios de Prometheus
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Configuración base de Prometheus
      ansible.builtin.copy:
        src: files/prometheus/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"

    - name: Reglas de alerta de Prometheus
      ansible.builtin.copy:
        src: files/prometheus/rules/
        dest: /etc/prometheus/rules/
        owner: prometheus
        group: prometheus
        mode: "0644"

    # ---- Grafana (apt) -------------------------------------------------------
    - name: Directorio de keyrings APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Clave GPG de Grafana
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Repositorio APT de Grafana
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Instalar Grafana OSS
      ansible.builtin.apt:
        name: "grafana={{ grafana_version }}"
        state: present
        update_cache: true

    - name: Provisioning — datasource de Prometheus
      ansible.builtin.copy:
        src: files/grafana/provisioning/datasources/prometheus.yml
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: grafana
        group: grafana
        mode: "0644"

    - name: Provisioning — provider de dashboards
      ansible.builtin.copy:
        src: files/grafana/provisioning/dashboards/provider.yml
        dest: /etc/grafana/provisioning/dashboards/provider.yml
        owner: grafana
        group: grafana
        mode: "0644"

    - name: Directorio de dashboards
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"

    - name: Dashboard tenant-overview
      ansible.builtin.copy:
        src: files/grafana/dashboards/tenant-overview.json
        dest: /var/lib/grafana/dashboards/tenant-overview.json
        owner: grafana
        group: grafana
        mode: "0644"

    - name: Dashboard control-center
      ansible.builtin.copy:
        src: files/grafana/dashboards/control-center.json
        dest: /var/lib/grafana/dashboards/control-center.json
        owner: grafana
        group: grafana
        mode: "0644"

    # ---- Unidades systemd ---------------------------------------------------
    - name: Instalar unidad systemd de Prometheus
      ansible.builtin.copy:
        src: files/systemd/prometheus.service
        dest: /etc/systemd/system/prometheus.service
        mode: "0644"

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Habilitar servicios al arrancar
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
      loop:
        - prometheus
        - grafana-server
        - prometheus-node-exporter

    # ---- Limpieza de temporales ---------------------------------------------
    - name: Eliminar archivos temporales de Prometheus
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus.tar.gz
        - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64"
